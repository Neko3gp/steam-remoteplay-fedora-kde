name: shellcheck
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh uninstall.sh lib/env.sh bin/remoteplay-launch bin/remoteplay-doctor mac/remoteplay-mac
